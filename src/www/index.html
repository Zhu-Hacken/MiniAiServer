<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Mini AI Chat</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
            border: 1px solid #333;
        }

        .header {
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            background: #212121;
            border-bottom: 1px solid #333;
            color: #ffffff;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .msg {
            margin: 10px 0;
            display: flex;
        }

        .msg.user {
            justify-content: flex-end;
        }

        .msg.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .bubble {
            background: #1976d2;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai .bubble {
            background: #2a2a2a;
            color: #ddd;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #333;
            padding: 10px;
            background: #212121;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            font-size: 15px;
            background: #2c2c2c;
            color: #f0f0f0;
            border: 1px solid #444;
            border-radius: 6px;
        }

        .input-area button {
            margin-left: 10px;
            padding: 10px 16px;
            font-size: 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🌙 Mini AI Chat</div>
        <div id="chatBox" class="chat-box"></div>
        <div class="input-area">
            <input id="msgInput" type="text" placeholder="请输入问题..." />
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        function addMessage(content, sender) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `msg ${sender}`;
            div.innerHTML = `<div class="bubble">${content}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById("msgInput");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");

            fetch('/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                input.value = '';
                const reply = data.data || "AI 暂无回复";
                addMessage(reply, "ai");
            })
            .catch(err => {
                addMessage("网络错误，请稍后重试。", "ai");
            })
        }

        // 🌟 监听 Enter 键
        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("msgInput");
            input.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    event.preventDefault();  // 防止默认换行
                    sendMessage();
                }
            });
            input.value = '';
        });
    </script>

</body>
</html>
