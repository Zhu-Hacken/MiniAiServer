<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Mini AI Chat</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #121212;
            font-family: "Segoe UI", sans-serif;
            color: #e0e0e0;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: #1e1e1e;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        }

        .header {
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            background: #212121;
            border-bottom: 1px solid #333;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .msg {
            margin: 10px 0;
            display: flex;
        }

        .msg.user {
            justify-content: flex-end;
        }

        .msg.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .bubble {
            background: #1976d2;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai .bubble {
            background: #2a2a2a;
            color: #ddd;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #212121;
            border-top: 1px solid #333;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            font-size: 15px;
            background: #2c2c2c;
            color: #f0f0f0;
            border: 1px solid #444;
            border-radius: 6px;
        }

        .input-area button {
            margin-left: 10px;
            padding: 10px 16px;
            font-size: 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .input-area button:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🌙 Mini AI Chat</div>
        <div id="chatBox" class="chat-box"></div>
        <div class="input-area">
            <input id="msgInput" type="text" placeholder="请输入问题..." />
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        let ws = null;

        function addMessage(content, sender) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `msg ${sender}`;
            div.innerHTML = `<div class="bubble">${content}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function disableSend(disabled) {
            document.getElementById("sendBtn").disabled = disabled;
        }

        let currentAiBubble = null;

        function sendMessage() {
            const input = document.getElementById("msgInput");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = '';
            disableSend(true);

            let sessionId = localStorage.getItem("sessionId") || "";

            if (!sessionId) {
                fetch('/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                })
                .then(res => res.json())
                .then(data => {
                    const reply = data.data || "AI 暂无回复";
                    addMessage(reply, "ai");
                    if (data.sessionId) {
                        localStorage.setItem("sessionId", data.sessionId);
                    }
                })
                .catch(() => {
                    addMessage("网络错误，请稍后重试。", "ai");
                })
                .finally(() => disableSend(false));
            } else {
                const wsUrl = `ws://${location.hostname}:9007/ai/streamInfer?sessionId=${sessionId}`;
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    currentAiBubble = document.createElement("div");
                    currentAiBubble.className = "msg ai";

                    const bubbleDiv = document.createElement("div");
                    bubbleDiv.className = "bubble";
                    bubbleDiv.textContent = "";

                    currentAiBubble.appendChild(bubbleDiv);
                    document.getElementById("chatBox").appendChild(currentAiBubble);
                    document.getElementById("chatBox").scrollTop = chatBox.scrollHeight;

                    ws.send(message);
                };

                ws.onmessage = (event) => {
                    if (event.data.includes("[DONE]")) {
                        ws.close();
                        ws = null;
                        disableSend(false);
                        return;
                    }

                    const bubble = currentAiBubble?.querySelector(".bubble");
                    if (bubble) {
                        bubble.textContent += event.data;
                        document.getElementById("chatBox").scrollTop = chatBox.scrollHeight;
                    }
                };

                ws.onclose = () => {
                    ws = null;
                    disableSend(false);
                };

                ws.onerror = () => {
                    addMessage("WebSocket 错误，请检查服务是否开启", "ai");
                    disableSend(false);
                };
            }
        }

        function loadHistory() {
            let sessionId = localStorage.getItem("sessionId");

            // 无 sessionId 时可提前结束
            if (!sessionId) return;

            fetch("/ai/history", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ sessionId })
            })
            .then(res => res.json())
            .then(data => {
                // 后端可能返回新 sessionId（原先失效），要及时更新
                if (data.sessionId) {
                    localStorage.setItem("sessionId", data.sessionId);
                }

                // 渲染历史内容
                if (Array.isArray(data.history)) {
                    data.history.forEach(pair => {
                        if (pair.user) addMessage(pair.user, "user");
                        if (pair.ai) addMessage(pair.ai, "ai");
                    });
                }
            })
            .catch(() => {
                console.warn("历史加载失败");
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadHistory(); // 页面加载时恢复上下文
            const input = document.getElementById("msgInput");
            input.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    event.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>

</body>
</html>
